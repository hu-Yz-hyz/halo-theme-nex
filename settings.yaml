            - label: 模糊淡入
              value: blur
            - label: 旋转淡入
              value: rotate
            - label: 无动画
              value: none
        - $formkit: number
          name: archive_list_duration
          label: 归档列表时长（秒）
          value: ""
          help: "留空跟随全局"
        - $formkit: switch
          name: post_content_enable
          label: 文章正文
          value: true
        - $formkit: select
          name: post_content_effect
          label: 正文效果
          value: ""
          options:
            - label: 跟随全局
              value: ""
            - label: 淡入上移
              value: fade-up
            - label: 淡入
              value: fade-in
            - label: 淡入下移
              value: fade-down
            - label: 左侧滑入
              value: slide-left
            - label: 右侧滑入
              value: slide-right
            - label: 缩放浮现
              value: zoom
            - label: 模糊淡入
              value: blur
            - label: 旋转淡入
              value: rotate
            - label: 无动画
              value: none
        - $formkit: number
          name: post_content_duration
          label: 正文时长（秒）
          value: ""
          help: "留空跟随全局"
        - $formkit: switch
          name: sidebar_enable
          label: 侧边栏
          value: true
        - $formkit: select
          name: sidebar_effect
          label: 侧边栏效果
          value: ""
          options:
            - label: 跟随全局
              value: ""
            - label: 淡入上移
              value: fade-up
            - label: 淡入
              value: fade-in
            - label: 淡入下移
              value: fade-down
            - label: 左侧滑入
              value: slide-left
            - label: 右侧滑入
              value: slide-right
            - label: 缩放浮现
              value: zoom
            - label: 模糊淡入
              value: blur
            - label: 旋转淡入
