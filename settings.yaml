            - label: 无动画
              value: none
        - $formkit: number
          name: sidebar_duration
          label: 侧边栏时长（秒）
          value: ""
          help: "留空跟随全局"
        - $formkit: switch
          name: footer_enable
          label: 页脚
          value: true
        - $formkit: select
          name: footer_effect
          label: 页脚效果
          value: ""
          options:
            - label: 跟随全局
              value: ""
            - label: 淡入上移
              value: fade-up
